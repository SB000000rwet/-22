<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймер зворотного відліку</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f4f4f4;
    }

    h1 {
        color: #391616;
    }

    #timer {
        font-size: 50px;
        font-weight: bold;
        color: #b54545;
        margin: 20px 0;
    }

    input {
        padding: 10px;
        width: 150px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    #message {
        margin-top: 15px;
        font-size: 20px;
        color: red;
        font-weight: bold;
    }

    #error {
        color: darkred;
        margin-top: 10px;
    }
</style>
</head>
<body>

<h1>Таймер зворотного відліку</h1>

<input
    type="number"
    id="secondsInput"
    placeholder="Введіть секунди"
    min="1"
/>

<div id="timer">0</div>

<button id="startBtn">Старт</button>
<button id="pauseBtn">Пауза</button>
<button id="increaseBtn">Збільшити час (+10)</button>
<button id="decreaseBtn">Зменшити час (-10)</button>

<div id="error"></div>
<div id="message"></div>

<script>
    let timeLeft = 0;
    let timerInterval = null;

    const input = document.getElementById("secondsInput");
    const timer = document.getElementById("timer");
    const message = document.getElementById("message");
    const error = document.getElementById("error");

    function updateTimer() {
        timer.textContent = timeLeft;
    }

    function validateInput() {
        const value = Number(input.value);

        if (input.value === "") {
            error.textContent = "Введіть кількість секунд!";
            return false;
        }

        if (isNaN(value) || value <= 0) {
            error.textContent = "Час повинен бути більше 0!";
            return false;
        }

        error.textContent = "";
        return true;
    }

    input.addEventListener("input", () => {
        validateInput();
    });

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            startTimer();
        }
    });

    function startTimer() {

        if (!validateInput()) {
            return;
        }

        if (timerInterval !== null) {
            return;
        }

        if (timeLeft <= 0) {
            timeLeft = Number(input.value);
        }

        message.textContent = "";

        timerInterval = setInterval(() => {

            timeLeft--;
            updateTimer();

            if (timeLeft <= 0) {

                clearInterval(timerInterval);
                timerInterval = null;

                timeLeft = 0;
                updateTimer();

                message.textContent = "Час вийшов!";
            }

        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

     function increaseTime() {
        timeLeft += 10;
        updateTimer();
    }

    function decreaseTime() {
        timeLeft -= 10;

        if (timeLeft < 0) {
            timeLeft = 0;
        }

        updateTimer();
    }

    document
        .getElementById("startBtn")
        .addEventListener("click", startTimer);

    document
        .getElementById("pauseBtn")
        .addEventListener("click", pauseTimer);

    document
        .getElementById("increaseBtn")
        .addEventListener("click", increaseTime);

    document
        .getElementById("decreaseBtn")
        .addEventListener("click", decreaseTime);

    updateTimer();
</script>

</body>
</html>
